version: '3.8'

services:
  backend:
    build: ./backend
    container_name: exam-shuffling-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: always

  # Optional: Frontend container for local development/preview
  # For production, we will build to S3/CloudFront
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam-shuffling-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
