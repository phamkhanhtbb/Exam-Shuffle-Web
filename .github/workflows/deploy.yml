name: Deploy to EC2 (Legacy - use docker-build-deploy.yml instead)

# ⚠️ THIS WORKFLOW IS DEPRECATED
# The new workflow "docker-build-deploy.yml" builds images on GitHub,
# pushes to Docker Hub, and deploys by pulling (no build on server).
# This file is kept for reference only.

on:
  workflow_dispatch:  # Manual trigger only (no longer auto-runs on push)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to EC2 (Legacy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ExamShuffling
            
            echo "📦 Pulling latest code..."
            git pull origin main
            
            echo "🔨 Building and starting containers..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            
            echo "⏳ Waiting for backend to start..."
            sleep 10
            
            echo "🔄 Restarting Nginx (DNS refresh)..."
            sudo docker restart exam-nginx
            
            echo "✅ Checking container status..."
            sudo docker ps --format "table {{.Names}}\t{{.Status}}" | grep exam
            
            echo "🧹 Cleaning up old images..."
            sudo docker image prune -f
            
            echo "🎉 Deploy complete!"
