name: CI - Test & Build Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  # ============================================
  # JOB 1: Backend — Lint + Test (pytest)
  # ============================================
  backend-test:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Use uv for 10-100x faster pip install
      - name: ⚡ Install uv
        run: pip install uv

      - name: 📦 Install dependencies (uv)
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio httpx

      - name: 🧪 Run tests
        run: pytest tests/ -v --tb=short
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: ap-southeast-1
          AWS_S3_BUCKET_INPUT: test-bucket-input
          AWS_S3_BUCKET_OUTPUT: test-bucket-output
          AWS_SQS_QUEUE_URL: https://sqs.ap-southeast-1.amazonaws.com/000000000000/test-queue
          AWS_DYNAMODB_TABLE: TestTable

  # ============================================
  # JOB 2: Frontend — TypeScript Build Check
  # ============================================
  frontend-build:
    name: ⚛️ Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 TypeScript Check
        run: npm exec tsc --noEmit
        env:
          CI: true
