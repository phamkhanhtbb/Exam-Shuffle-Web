name: CI - Test & Build Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # JOB 1: Backend — Lint + Test (pytest)
  # ============================================
  backend-test:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: 🧪 Run tests
        run: pytest tests/ -v --tb=short
        env:
          # Provide dummy env vars so imports don't fail
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: ap-southeast-1
          AWS_S3_BUCKET_INPUT: test-bucket-input
          AWS_S3_BUCKET_OUTPUT: test-bucket-output
          AWS_SQS_QUEUE_URL: https://sqs.ap-southeast-1.amazonaws.com/000000000000/test-queue
          AWS_DYNAMODB_TABLE: TestTable

  # ============================================
  # JOB 2: Frontend — TypeScript Build Check
  # ============================================
  frontend-build:
    name: ⚛️ Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔨 Build (TypeScript check + bundle)
        run: npm run build
        env:
          CI: true
          REACT_APP_API_URL: https://api.example.com
