name: Build, Push & Deploy

on:
  push:
    branches: [main]

# Only allow one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================
  # JOB 1: Run CI checks first
  # ============================================
  ci:
    name: ✅ CI Gate
    uses: ./.github/workflows/ci.yml

  # ============================================
  # JOB 2: Build Docker images & push to Docker Hub
  # ============================================
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: ci  # Only build if CI passes
    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and Push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}

  # ============================================
  # JOB 3: Deploy to EC2 (Pull images, no build on server)
  # ============================================
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ExamShuffling

            echo "📦 Pulling latest code (for docker-compose & configs)..."
            git pull origin main

            echo "🔑 Docker Hub login..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "📥 Pulling pre-built images..."
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/exam-backend:latest
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/exam-frontend:latest

            echo "🔄 Updating containers..."
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            echo "⏳ Waiting for backend health check..."
            sleep 10

            echo "🔄 Restarting Nginx (DNS refresh)..."
            sudo docker restart exam-nginx

            echo "✅ Checking container status..."
            sudo docker ps --format "table {{.Names}}\t{{.Status}}" | grep exam

            echo "🧹 Cleaning up old images..."
            sudo docker image prune -f

            echo "🎉 Deploy complete!"
