name: Build, Push & Deploy

on:
  push:
    branches: [main]

# Only allow one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================
  # JOB 1: Run CI checks first
  # ============================================
  ci:
    name: ✅ CI Gate
    uses: ./.github/workflows/ci.yml

  # ============================================
  # JOB 2: Build Docker image & push to Docker Hub
  # ============================================
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # JOB 3: Deploy to EC2 (Pull images, no build on server)
  # ============================================
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ExamShuffling

            echo "📦 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔑 Logging in to Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "📥 Pulling fresh backend image..."
            sudo docker pull phamkhanhtbb/exam-backend:latest

            echo "🛑 Stopping old containers..."
            sudo docker compose -f docker-compose.prod.yml down --remove-orphans || true

            echo "🚀 Starting fresh containers..."
            sudo docker compose -f docker-compose.prod.yml --env-file backend/.env up -d --pull never

            echo "⏳ Waiting for backend health check (30s)..."
            sleep 30

            echo "🔄 Restarting Nginx to refresh DNS..."
            if sudo docker ps --format '{{.Names}}' | grep -q exam-nginx; then
              sudo docker restart exam-nginx
              echo "✅ Nginx restarted."
            else
              echo "⚠️  Nginx container not found — checking logs:"
              sudo docker compose -f docker-compose.prod.yml --env-file backend/.env logs nginx --tail 20 || true
            fi

            echo "✅ Container status:"
            sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            echo "📋 Backend last 10 log lines:"
            sudo docker logs exam-backend --tail 10 || true

            echo "🧹 Cleaning up dangling images..."
            sudo docker image prune -f

            echo "🎉 Deploy complete!"
