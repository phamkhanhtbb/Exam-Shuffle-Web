name: CI/CD Pipeline - Exam Shuffle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: true # Tự động hủy job cũ nếu có code mới được push lên liên tục

jobs:
  # ============================================
  # 0. PHÂN LOẠI THAY ĐỔI (Path Filtering)
  # ============================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.prod.yml'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'

  # ============================================
  # 1. CI FRONTEND (Chỉ chạy khi có sửa thư mục frontend)
  # ============================================
  frontend-ci:
    name: ⚛️ Frontend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Build Check
        run: |
          npm exec tsc --noEmit
          npm run build --if-present
        env:
          CI: true

  # ============================================
  # 2. CI BACKEND (Chỉ chạy khi có sửa thư mục backend)
  # ============================================
  backend-ci:
    name: 🐍 Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Caching cho uv để cài package trong nháy mắt
      - name: Setup uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install uv & dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio httpx ruff

      - name: Lint & Test
        run: |
          ruff check .
          pytest tests/ -v --tb=short
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: ap-southeast-1
          AWS_S3_BUCKET_INPUT: test-input
          AWS_S3_BUCKET_OUTPUT: test-output

  # ============================================
  # 3. BUILD & DEPLOY BACKEND (Chỉ chạy khi Backend CI pass và ở nhánh main)
  # ============================================
  deploy-backend:
    name: 🐳 Build & Deploy Backend
    needs: [detect-changes, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tối ưu Cache Docker Layer
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSH Deploy (Zero-Downtime)
      - name: Execute SSH to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ExamShuffling

            # Git pull nhẹ nhàng chỉ để lấy file config
            git fetch origin main
            git reset --hard origin/main

            # Pull image siêu tốc vì Docker Hub chỉ tải các layer bị thay đổi
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/exam-backend:latest

            # Khởi động lại service bằng image mới mà không làm rớt mạng (no-deps recreation)
            sudo docker compose -f docker-compose.prod.yml --env-file backend/.env up -d --no-deps --build exam-backend exam-worker

            # Dọn dẹp cache rác trên EC2
            sudo docker image prune -f
