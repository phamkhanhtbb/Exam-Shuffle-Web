version: '3.8'

services:
  # === BACKEND API SERVER ===
  backend:
    build: ./backend
    container_name: exam-backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/docs')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # === WORKER (SQS Consumer) ===
  worker:
    build: ./backend
    container_name: exam-worker
    restart: always
    command: [ "python", "worker.py" ]
    env_file:
      - ./backend/.env
    healthcheck:
      test: [ "CMD", "pgrep", "-f", "worker.py" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # === FRONTEND (React + Nginx) ===
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: https://api.trondeonline.me
        REACT_APP_AWS_REGION: ap-southeast-1
        REACT_APP_S3_BUCKET_INPUT: app-docx-input-team1
        REACT_APP_S3_BUCKET_OUTPUT: app-docx-output-team1
        REACT_APP_SQS_QUEUE_URL: ${REACT_APP_SQS_QUEUE_URL}
        REACT_APP_DYNAMODB_TABLE: DocxJobs
        REACT_APP_AWS_ACCESS_KEY_ID: ${REACT_APP_AWS_ACCESS_KEY_ID}
        REACT_APP_AWS_SECRET_ACCESS_KEY: ${REACT_APP_AWS_SECRET_ACCESS_KEY}
    container_name: exam-frontend
    restart: always
    expose:
      - "80"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # === NGINX REVERSE PROXY (SSL Termination) ===
  nginx:
    image: nginx:alpine
    container_name: exam-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app-network

  # === CERTBOT (SSL Certificates) ===
  certbot:
    image: certbot/certbot
    container_name: exam-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  # === MONITORING ===
  prometheus:
    image: prom/prometheus:latest
    container_name: exam-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: exam-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=examshuffling2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - app-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: exam-cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: exam-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
