worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Upstream definitions
    upstream backend {
        server backend:5000;
    }

    upstream frontend {
        server frontend:80;
    }

    # --- HTTP: Redirect to HTTPS + ACME challenge ---
    server {
        listen 80;
        server_name trondeonline.me www.trondeonline.me api.trondeonline.me;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: Frontend (trondeonline.me) ---
    server {
        listen 443 ssl;
        server_name trondeonline.me www.trondeonline.me;

        ssl_certificate /etc/letsencrypt/live/trondeonline.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/trondeonline.me/privkey.pem;

        # SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- HTTPS: Backend API (api.trondeonline.me) ---
    server {
        listen 443 ssl;
        server_name api.trondeonline.me;

        ssl_certificate /etc/letsencrypt/live/trondeonline.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/trondeonline.me/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # CORS headers for API
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeout for file uploads
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            client_max_body_size 50M;
        }
    }
}
