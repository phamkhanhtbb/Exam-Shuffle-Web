# docker-compose for initial setup (HTTP only, to get SSL certs)
version: '3.8'

services:
  backend:
    build: ./backend
    container_name: exam-backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    networks:
      - app-network

  worker:
    build: ./backend
    container_name: exam-worker
    restart: always
    command: [ "python", "worker.py" ]
    env_file:
      - ./backend/.env
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api.trondeonline.me
        VITE_AWS_REGION: ap-southeast-1
        VITE_S3_BUCKET_INPUT: app-docx-input-team1
        VITE_S3_BUCKET_OUTPUT: app-docx-output-team1
        VITE_SQS_QUEUE_URL: ${VITE_SQS_QUEUE_URL}
        VITE_DYNAMODB_TABLE: DocxJobs
        VITE_AWS_ACCESS_KEY_ID: ${VITE_AWS_ACCESS_KEY_ID}
        VITE_AWS_SECRET_ACCESS_KEY: ${VITE_AWS_SECRET_ACCESS_KEY}
    container_name: exam-frontend
    restart: always
    expose:
      - "80"
    networks:
      - app-network

  # Nginx HTTP-only (for initial SSL cert generation)
  nginx:
    image: nginx:alpine
    container_name: exam-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/init-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: exam-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

networks:
  app-network:
    driver: bridge
